services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsc-photobox-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-production}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ORIGIN_ALLOWED: ${ORIGIN_ALLOWED:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    container_name: dsc-photobox-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------
  # PostgreSQL Database (Lokal - Opsional)
  # Jika ingin menggunakan database lokal, silakan uncomment service ini
